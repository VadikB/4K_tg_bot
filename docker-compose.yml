services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: 4k_tg_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d 4k_tg_bot"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - bot_postgres_data:/var/lib/postgresql/data

volumes:
  bot_postgres_data:

